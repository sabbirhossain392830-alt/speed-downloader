name: Build DROX APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'development/1dm-style-ui' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name speed_downloader .
      - name: Configure Android permissions and share intents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          ns = "{http://schemas.android.com/apk/res/android}"
          tools = "{http://schemas.android.com/tools}"
          tree = ET.parse(path)
          root = tree.getroot()

          for permission in ("android.permission.INTERNET", "android.permission.POST_NOTIFICATIONS",
                             "android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_DATA_SYNC"):
              if not any(node.get(ns + "name") == permission for node in root.findall("uses-permission")):
                  ET.SubElement(root, "uses-permission", {ns + "name": permission})

          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element not found")
          app.set(ns + "label", "DROX")

          foreground = next((node for node in app.findall("service")
                             if node.get(ns + "name") == "androidx.work.impl.foreground.SystemForegroundService"), None)
          if foreground is None:
              foreground = ET.SubElement(app, "service", {ns + "name": "androidx.work.impl.foreground.SystemForegroundService"})
          foreground.set(ns + "foregroundServiceType", "dataSync")
          foreground.set(tools + "node", "merge")

          activity = next((node for node in app.findall("activity")
                           if node.get(ns + "name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("MainActivity not found in AndroidManifest.xml")

          activity.set(ns + "exported", "true")
          activity.set(ns + "launchMode", "singleTop")

          def add_filter(action, categories, mime=None, schemes=()):
              f = ET.SubElement(activity, "intent-filter")
              ET.SubElement(f, "action", {ns + "name": action})
              for category in categories:
                  ET.SubElement(f, "category", {ns + "name": category})
              if mime:
                  ET.SubElement(f, "data", {ns + "mimeType": mime})
              for scheme in schemes:
                  ET.SubElement(f, "data", {ns + "scheme": scheme})

          if not any(x.find("action") is not None and
                     x.find("action").get(ns + "name") == "android.intent.action.SEND"
                     for x in activity.findall("intent-filter")):
              add_filter("android.intent.action.SEND",
                         ["android.intent.category.DEFAULT"], "text/plain")

          if not any(x.find("action") is not None and
                     x.find("action").get(ns + "name") == "android.intent.action.VIEW"
                     for x in activity.findall("intent-filter")):
              add_filter("android.intent.action.VIEW",
                         ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"],
                         schemes=("http", "https"))

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("AndroidManifest.xml validated")
          PY
          mkdir -p android/app/src/main/kotlin/com/example/speed_downloader
          cat > android/app/src/main/kotlin/com/example/speed_downloader/MainActivity.kt <<'KOTLIN'
          package com.example.speed_downloader

          import android.content.Intent
          import android.os.Bundle
          import android.content.ContentValues
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import java.io.File
          import java.io.FileOutputStream
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val methodName = "drox/share"
              private val eventName = "drox/share_events"
              private val sessionName = "drox/browser_session"
              private var eventSink: EventChannel.EventSink? = null
              private var pendingText: String? = null
              private val blobStreams = mutableMapOf<String, java.io.OutputStream>()
              private val blobUris = mutableMapOf<String, android.net.Uri>()
              private val blobNames = mutableMapOf<String, String>()

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, methodName).setMethodCallHandler { call, result ->
                      if (call.method == "getInitialSharedText") {
                          result.success(pendingText ?: sharedText(intent))
                          pendingText = null
                      } else result.notImplemented()
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, sessionName).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getCookies" -> {
                              val url = call.argument<String>("url")
                              if (url.isNullOrBlank() || !(url.startsWith("https://") || url.startsWith("http://"))) {
                                  result.success(null)
                              } else {
                                  result.success(android.webkit.CookieManager.getInstance().getCookie(url))
                              }
                          }
                          "getUserAgent" -> result.success(android.webkit.WebSettings.getDefaultUserAgent(this))
                          "blobStart" -> {
                              try {
                                  val id = call.argument<String>("id") ?: throw IllegalArgumentException("Missing blob id")
                                  val rawName = call.argument<String>("filename") ?: "drox_blob.bin"
                                  val name = rawName.replace(Regex("[\\\\/:*?\"<>|\\r\\n]"), "_").ifBlank { "drox_blob.bin" }
                                  val output: java.io.OutputStream
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      val values = ContentValues().apply {
                                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                                          put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream")
                                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/DROX")
                                          put(MediaStore.Downloads.IS_PENDING, 1)
                                      }
                                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                                          ?: throw IllegalStateException("Could not create Downloads file")
                                      blobUris[id] = uri
                                      output = contentResolver.openOutputStream(uri) ?: throw IllegalStateException("Could not open Downloads file")
                                  } else {
                                      val dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                                      val folder = File(dir, "DROX").apply { mkdirs() }
                                      output = FileOutputStream(File(folder, name))
                                  }
                                  blobStreams[id] = output
                                  blobNames[id] = name
                                  result.success(true)
                              } catch (e: Exception) { result.error("BLOB_START", e.message, null) }
                          }
                          "blobChunk" -> {
                              try {
                                  val id = call.argument<String>("id") ?: throw IllegalArgumentException("Missing blob id")
                                  val data = call.argument<String>("data") ?: ""
                                  val output = blobStreams[id] ?: throw IllegalStateException("Blob stream not found")
                                  output.write(Base64.decode(data, Base64.DEFAULT))
                                  result.success(true)
                              } catch (e: Exception) { result.error("BLOB_CHUNK", e.message, null) }
                          }
                          "blobEnd" -> {
                              try {
                                  val id = call.argument<String>("id") ?: throw IllegalArgumentException("Missing blob id")
                                  blobStreams.remove(id)?.close()
                                  val uri = blobUris.remove(id)
                                  if (uri != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      val values = ContentValues().apply { put(MediaStore.Downloads.IS_PENDING, 0) }
                                      contentResolver.update(uri, values, null, null)
                                  }
                                  result.success(blobNames.remove(id) ?: "drox_blob.bin")
                              } catch (e: Exception) { result.error("BLOB_END", e.message, null) }
                          }
                          else -> result.notImplemented()
                      }
                  }
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, eventName).setStreamHandler(object : EventChannel.StreamHandler {
                      override fun onListen(arguments: Any?, events: EventChannel.EventSink?) { eventSink = events }
                      override fun onCancel(arguments: Any?) { eventSink = null }
                  })
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val text = sharedText(intent)
                  if (text != null) {
                      if (eventSink != null) eventSink?.success(text) else pendingText = text
                  }
              }

              private fun sharedText(source: Intent?): String? {
                  if (source == null) return null
                  return when (source.action) {
                      Intent.ACTION_SEND -> source.getStringExtra(Intent.EXTRA_TEXT) ?: source.getStringExtra(Intent.EXTRA_SUBJECT)
                      Intent.ACTION_VIEW -> source.dataString
                      else -> null
                  }?.takeIf { it.isNotBlank() }
              }
          }
          KOTLIN
      - name: Build APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if kotlin.exists():
              with kotlin.open("a") as f:
                  f.write("\n\nandroid { packaging { jniLibs { useLegacyPackaging = true } } }\n")
          elif groovy.exists():
              with groovy.open("a") as f:
                  f.write("\n\nandroid { packagingOptions { jniLibs { useLegacyPackaging true } } }\n")
          else:
              raise SystemExit("App Gradle build file not found")
          PY
          flutter pub get
          flutter analyze lib/main.dart
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
