name: Build DROX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name speed_downloader .
      - name: Configure Android permissions and share intents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()

          for permission in (
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
              "android.permission.RUN_USER_INITIATED_JOBS",
          ):
              if not any(node.get(ns + "name") == permission for node in root.findall("uses-permission")):
                  ET.SubElement(root, "uses-permission", {ns + "name": permission})

          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element not found")

          # Allow the installed app's APK to be shared as a file attachment.
          provider_name = "androidx.core.content.FileProvider"
          if not any(node.get(ns + "name") == provider_name for node in app.findall("provider")):
              provider = ET.SubElement(app, "provider", {
                  ns + "name": provider_name,
                  ns + "authorities": "${applicationId}.fileprovider",
                  ns + "exported": "false",
                  ns + "grantUriPermissions": "true",
              })
              meta = ET.SubElement(provider, "meta-data", {
                  ns + "name": "android.support.FILE_PROVIDER_PATHS",
                  ns + "resource": "@xml/drox_file_paths",
              })

          # Allow long-running downloads to use Android's foreground worker.
          service_name = "androidx.work.impl.foreground.SystemForegroundService"
          service = next((node for node in app.findall("service")
                          if node.get(ns + "name") == service_name), None)
          if service is None:
              service = ET.SubElement(app, "service", {ns + "name": service_name})
          service.set(ns + "foregroundServiceType", "dataSync")

          # User Initiated Data Transfer (Android 14+) service required by
          # TransferHint.userInitiated tasks and their native notification actions.
          uidt_name = "com.bbflight.background_downloader.UIDTJobService"
          uidt_service = next((node for node in app.findall("service")
                               if node.get(ns + "name") == uidt_name), None)
          if uidt_service is None:
              uidt_service = ET.SubElement(app, "service", {ns + "name": uidt_name})
          uidt_service.set(ns + "permission", "android.permission.BIND_JOB_SERVICE")
          uidt_service.set(ns + "exported", "true")
          uidt_service.set(ns + "foregroundServiceType", "dataSync")

          activity = next((node for node in app.findall("activity")
                           if node.get(ns + "name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("MainActivity not found in AndroidManifest.xml")

          activity.set(ns + "exported", "true")
          activity.set(ns + "launchMode", "singleTop")

          def add_filter(action, categories, mime=None, schemes=()):
              f = ET.SubElement(activity, "intent-filter")
              ET.SubElement(f, "action", {ns + "name": action})
              for category in categories:
                  ET.SubElement(f, "category", {ns + "name": category})
              if mime:
                  ET.SubElement(f, "data", {ns + "mimeType": mime})
              for scheme in schemes:
                  ET.SubElement(f, "data", {ns + "scheme": scheme})

          if not any(x.find("action") is not None and
                     x.find("action").get(ns + "name") == "android.intent.action.SEND"
                     for x in activity.findall("intent-filter")):
              add_filter("android.intent.action.SEND",
                         ["android.intent.category.DEFAULT"], "text/plain")

          if not any(x.find("action") is not None and
                     x.find("action").get(ns + "name") == "android.intent.action.VIEW"
                     for x in activity.findall("intent-filter")):
              add_filter("android.intent.action.VIEW",
                         ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"],
                         schemes=("http", "https"))

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("AndroidManifest.xml validated")
          PY
          mkdir -p android/app/src/main/kotlin/com/example/speed_downloader android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/drox_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_apk" path="shared/" />
          </paths>
          XML
          cat > android/app/src/main/kotlin/com/example/speed_downloader/MainActivity.kt <<'KOTLIN'
          package com.example.speed_downloader

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val methodName = "drox/share"
              private val eventName = "drox/share_events"
              private val notificationName = "drox/notifications"
              private val channelId = "drox_download_details"
              private var eventSink: EventChannel.EventSink? = null
              private var pendingText: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createDownloadChannel()
              }

              private fun createDownloadChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "DROX download details", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Live download progress, speed and remaining time"
                          setShowBadge(false)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, notificationName).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "updateDownload" -> {
                              try {
                                  val args = call.arguments as Map<*, *>
                                  val id = (args["id"] as Number).toInt()
                                  val title = args["title"]?.toString() ?: "DROX • Downloading"
                                  val filename = args["filename"]?.toString() ?: "File"
                                  val details = args["details"]?.toString() ?: ""
                                  val progress = ((args["progress"] as? Number)?.toInt() ?: 0).coerceIn(0, 100)
                                  val ongoing = args["ongoing"] as? Boolean ?: true
                                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)
                                  val openApp = launchIntent?.let {
                                      PendingIntent.getActivity(this, 0, it, PendingIntent.FLAG_UPDATE_CURRENT or
                                          (if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0))
                                  }
                                  val builder = NotificationCompat.Builder(this, channelId)
                                      .setSmallIcon(android.R.drawable.stat_sys_download)
                                      .setContentTitle(title)
                                      .setContentText(filename)
                                      .setStyle(NotificationCompat.BigTextStyle().bigText("$filename\n$details"))
                                      .setProgress(100, progress, false)
                                      .setOnlyAlertOnce(true)
                                      .setOngoing(ongoing)
                                      .setAutoCancel(!ongoing)
                                      .setCategory(NotificationCompat.CATEGORY_PROGRESS)
                                      .setPriority(NotificationCompat.PRIORITY_LOW)
                                  if (openApp != null) builder.setContentIntent(openApp)
                                  NotificationManagerCompat.from(this).notify(id, builder.build())
                                  result.success(null)
                              } catch (error: Exception) {
                                  result.error("NOTIFICATION_FAILED", error.message ?: "Could not update notification", null)
                              }
                          }
                          "cancelDownload" -> {
                              val id = (call.arguments as? Number)?.toInt()
                              if (id != null) NotificationManagerCompat.from(this).cancel(id)
                              result.success(null)
                          }
                          else -> result.notImplemented()
                      }
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, methodName).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getInitialSharedText" -> {
                              result.success(pendingText ?: sharedText(intent))
                              pendingText = null
                          }
                          "shareApp" -> {
                              try {
                                  val sourceApk = File(applicationInfo.sourceDir)
                                  val sharedDir = File(cacheDir, "shared").apply { mkdirs() }
                                  val sharedApk = File(sharedDir, "DROX.apk")
                                  sourceApk.inputStream().use { input ->
                                      sharedApk.outputStream().use { output -> input.copyTo(output) }
                                  }
                                  val apkUri: Uri = FileProvider.getUriForFile(this, "${packageName}.fileprovider", sharedApk)
                                  val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                      type = "application/vnd.android.package-archive"
                                      putExtra(Intent.EXTRA_STREAM, apkUri)
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  }
                                  startActivity(Intent.createChooser(shareIntent, "Share DROX APK"))
                                  result.success(null)
                              } catch (error: Exception) {
                                  result.error("APK_SHARE_FAILED", error.message ?: "Could not share DROX APK", null)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, eventName).setStreamHandler(object : EventChannel.StreamHandler {
                      override fun onListen(arguments: Any?, events: EventChannel.EventSink?) { eventSink = events }
                      override fun onCancel(arguments: Any?) { eventSink = null }
                  })
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val text = sharedText(intent)
                  if (text != null) {
                      if (eventSink != null) eventSink?.success(text) else pendingText = text
                  }
              }

              private fun sharedText(source: Intent?): String? {
                  if (source == null) return null
                  return when (source.action) {
                      Intent.ACTION_SEND -> source.getStringExtra(Intent.EXTRA_TEXT) ?: source.getStringExtra(Intent.EXTRA_SUBJECT)
                      Intent.ACTION_VIEW -> source.dataString
                      else -> null
                  }?.takeIf { it.isNotBlank() }
              }
          }
          KOTLIN
      - name: Build APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # AndroidX dependencies require compileSdk 34+. Force API 36 regardless of Flutter template syntax.
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          found = False
          for gradle_path in candidates:
              if not gradle_path.exists():
                  continue
              found = True
              gradle_text = gradle_path.read_text()
              updated, count1 = re.subn(r"(?m)(\bcompileSdk\s*=\s*)[^\n]+", lambda m: m.group(1) + "36", gradle_text)
              updated, count2 = re.subn(r"(?m)(\bcompileSdkVersion\s+)[^\s]+", lambda m: m.group(1) + "36", updated)
              if count1 + count2 == 0:
                  raise SystemExit(f"Could not locate compileSdk declaration in {gradle_path}")
              gradle_path.write_text(updated)
              print(f"Set compileSdk=36 in {gradle_path}")
          if not found:
              raise SystemExit("Android app Gradle build file not found")
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if kotlin.exists():
              with kotlin.open("a") as f:
                  f.write("\n\nandroid { packaging { jniLibs { useLegacyPackaging = true } } }\n")
          elif groovy.exists():
              with groovy.open("a") as f:
                  f.write("\n\nandroid { packagingOptions { jniLibs { useLegacyPackaging true } } }\n")
          else:
              raise SystemExit("App Gradle build file not found")
          PY
          flutter pub get
          python3 tool/patch_background_downloader_notifications.py
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
