name: Build DROX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name speed_downloader .
      - name: Configure Android permissions and share intents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()

          for permission in ("android.permission.INTERNET", "android.permission.POST_NOTIFICATIONS"):
              if not any(node.get(ns + "name") == permission for node in root.findall("uses-permission")):
                  ET.SubElement(root, "uses-permission", {ns + "name": permission})

          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element not found")

          activity = next((node for node in app.findall("activity")
                           if node.get(ns + "name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("MainActivity not found in AndroidManifest.xml")

          activity.set(ns + "exported", "true")
          activity.set(ns + "launchMode", "singleTop")

          def add_filter(action, categories, mime=None, schemes=()):
              f = ET.SubElement(activity, "intent-filter")
              ET.SubElement(f, "action", {ns + "name": action})
              for category in categories:
                  ET.SubElement(f, "category", {ns + "name": category})
              if mime:
                  ET.SubElement(f, "data", {ns + "mimeType": mime})
              for scheme in schemes:
                  ET.SubElement(f, "data", {ns + "scheme": scheme})

          if not any(x.find("action") is not None and
                     x.find("action").get(ns + "name") == "android.intent.action.SEND"
                     for x in activity.findall("intent-filter")):
              add_filter("android.intent.action.SEND",
                         ["android.intent.category.DEFAULT"], "text/plain")

          if not any(x.find("action") is not None and
                     x.find("action").get(ns + "name") == "android.intent.action.VIEW"
                     for x in activity.findall("intent-filter")):
              add_filter("android.intent.action.VIEW",
                         ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"],
                         schemes=("http", "https"))

          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("AndroidManifest.xml validated")
          PY
          mkdir -p android/app/src/main/kotlin/com/example/speed_downloader
          cat > android/app/src/main/kotlin/com/example/speed_downloader/MainActivity.kt <<'KOTLIN'
          package com.example.speed_downloader

          import android.content.Intent
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val methodName = "drox/share"
              private val eventName = "drox/share_events"
              private var eventSink: EventChannel.EventSink? = null
              private var pendingText: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, methodName).setMethodCallHandler { call, result ->
                      if (call.method == "getInitialSharedText") {
                          result.success(pendingText ?: sharedText(intent))
                          pendingText = null
                      } else result.notImplemented()
                  }
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, eventName).setStreamHandler(object : EventChannel.StreamHandler {
                      override fun onListen(arguments: Any?, events: EventChannel.EventSink?) { eventSink = events }
                      override fun onCancel(arguments: Any?) { eventSink = null }
                  })
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val text = sharedText(intent)
                  if (text != null) {
                      if (eventSink != null) eventSink?.success(text) else pendingText = text
                  }
              }

              private fun sharedText(source: Intent?): String? {
                  if (source == null) return null
                  return when (source.action) {
                      Intent.ACTION_SEND -> source.getStringExtra(Intent.EXTRA_TEXT) ?: source.getStringExtra(Intent.EXTRA_SUBJECT)
                      Intent.ACTION_VIEW -> source.dataString
                      else -> null
                  }?.takeIf { it.isNotBlank() }
              }
          }
          KOTLIN
      - name: Build APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # AndroidX dependencies require compileSdk 34+. Force API 36 regardless of Flutter template syntax.
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          found = False
          for gradle_path in candidates:
              if not gradle_path.exists():
                  continue
              found = True
              gradle_text = gradle_path.read_text()
              updated, count1 = re.subn(r"(?m)(\\bcompileSdk\\s*=\\s*)[^\\n]+", r"\\g<1>36", gradle_text)
              updated, count2 = re.subn(r"(?m)(\\bcompileSdkVersion\\s+)[^\\s]+", r"\\g<1>36", updated)
              if count1 + count2 == 0:
                  raise SystemExit(f"Could not locate compileSdk declaration in {gradle_path}")
              gradle_path.write_text(updated)
              print(f"Set compileSdk=36 in {gradle_path}")
          if not found:
              raise SystemExit("Android app Gradle build file not found")
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if kotlin.exists():
              with kotlin.open("a") as f:
                  f.write("\n\nandroid { packaging { jniLibs { useLegacyPackaging = true } } }\n")
          elif groovy.exists():
              with groovy.open("a") as f:
                  f.write("\n\nandroid { packagingOptions { jniLibs { useLegacyPackaging true } } }\n")
          else:
              raise SystemExit("App Gradle build file not found")
          PY
          flutter pub get
          flutter analyze lib/main.dart
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
