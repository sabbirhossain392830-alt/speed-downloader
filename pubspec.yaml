name: speed_downloader
description: A fast and simple direct link downloader.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.8.0+1
  background_downloader: 9.6.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.1
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
